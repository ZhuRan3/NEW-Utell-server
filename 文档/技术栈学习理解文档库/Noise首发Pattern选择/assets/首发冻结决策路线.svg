<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">NEW-Utell Noise 首发冻结决策路线</title>
  <desc id="desc">展示从扫码授权到 XX 握手、指纹绑定、传输模式和重连优化的决策流程。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;fill:#172033}.box{stroke-width:3}.t{font-size:21px;font-weight:800}.s{font-size:17px}.a{stroke:#334e68;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334e68"/></marker></defs>
  <rect width="1200" height="700" fill="#f7fafc"/>
  <path d="M220 180 H350 M510 180 H640 M800 180 H930 M1050 230 V440 H930 M800 500 H640 M510 500 H350 M220 500 H120 V180 H150" class="a"/>
  <rect x="40" y="110" width="180" height="140" rx="18" fill="#fef3c7" stroke="#d97706" class="box"/><text x="130" y="148" text-anchor="middle" class="t">1. 扫码授权</text><text x="130" y="181" text-anchor="middle" class="s">一次性 token</text><text x="130" y="207" text-anchor="middle" class="s">5 分钟 / 仅一次</text><text x="130" y="233" text-anchor="middle" class="s">Relay 登记 pairing</text>
  <rect x="350" y="110" width="160" height="140" rx="18" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="430" y="148" text-anchor="middle" class="t">2. 建立 XX</text><text x="430" y="181" text-anchor="middle" class="s">手机 initiator</text><text x="430" y="207" text-anchor="middle" class="s">Connector responder</text><text x="430" y="233" text-anchor="middle" class="s">Noise_XX_...</text>
  <rect x="640" y="110" width="160" height="140" rx="18" fill="#dcfce7" stroke="#059669" class="box"/><text x="720" y="148" text-anchor="middle" class="t">3. 互验身份</text><text x="720" y="181" text-anchor="middle" class="s">交换静态公钥</text><text x="720" y="207" text-anchor="middle" class="s">比对指纹</text><text x="720" y="233" text-anchor="middle" class="s">用户确认绑定</text>
  <rect x="930" y="110" width="220" height="140" rx="18" fill="#e0e7ff" stroke="#4f46e5" class="box"/><text x="1040" y="148" text-anchor="middle" class="t">4. Transport</text><text x="1040" y="181" text-anchor="middle" class="s">双向 AEAD 密文</text><text x="1040" y="207" text-anchor="middle" class="s">Relay 只转发</text><text x="1040" y="233" text-anchor="middle" class="s">无业务明文</text>
  <rect x="640" y="430" width="160" height="140" rx="18" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="720" y="468" text-anchor="middle" class="t">5. 日常重连</text><text x="720" y="501" text-anchor="middle" class="s">首发仍用 XX</text><text x="720" y="527" text-anchor="middle" class="s">先验证兼容性</text><text x="720" y="553" text-anchor="middle" class="s">暂不偷渡 IK</text>
  <rect x="350" y="430" width="160" height="140" rx="18" fill="#fef3c7" stroke="#d97706" class="box"/><text x="430" y="468" text-anchor="middle" class="t">6. 未来优化</text><text x="430" y="501" text-anchor="middle" class="s">缓存静态公钥</text><text x="430" y="527" text-anchor="middle" class="s">单独评估 IK</text><text x="430" y="553" text-anchor="middle" class="s">或 Noise Pipes</text>
  <rect x="40" y="430" width="180" height="140" rx="18" fill="#fee2e2" stroke="#dc2626" class="box"/><text x="130" y="468" text-anchor="middle" class="t">失败即回滚</text><text x="130" y="501" text-anchor="middle" class="s">指纹不符 / token 失效</text><text x="130" y="527" text-anchor="middle" class="s">重放 / 篡改 / 公钥变更</text><text x="130" y="553" text-anchor="middle" class="s">拒绝建链，不显示 READY</text>
  <rect x="270" y="615" width="660" height="50" rx="14" fill="#16324f"/><text x="600" y="647" text-anchor="middle" font-size="20" fill="white">冻结闸门：双方角色、协议名、向量、rekey、错误码、撤销与回滚证据齐全</text>
</svg>
