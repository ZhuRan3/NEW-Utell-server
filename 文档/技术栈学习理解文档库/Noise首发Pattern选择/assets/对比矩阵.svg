<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Noise XX 与 IK 决策对比矩阵</title>
  <desc id="desc">比较消息数、前置条件、身份隐藏、扫码兼容、实现复杂度、失败后果和 NEW-Utell 适配。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;fill:#172033}.h{font-size:23px;font-weight:800}.c{font-size:18px}.r{font-size:19px;font-weight:700}</style></defs>
  <rect width="1200" height="800" fill="#f7fafc"/>
  <rect x="42" y="42" width="1116" height="70" rx="14" fill="#16324f"/>
  <text x="190" y="87" text-anchor="middle" class="h" fill="white">判断维度</text><text x="590" y="87" text-anchor="middle" class="h" fill="#bbf7d0">XX</text><text x="965" y="87" text-anchor="middle" class="h" fill="#bfdbfe">IK</text>
  <g stroke="#cbd5e0" stroke-width="2"><line x1="42" y1="112" x2="1158" y2="112"/><line x1="42" y1="209" x2="1158" y2="209"/><line x1="42" y1="306" x2="1158" y2="306"/><line x1="42" y1="403" x2="1158" y2="403"/><line x1="42" y1="500" x2="1158" y2="500"/><line x1="42" y1="597" x2="1158" y2="597"/><line x1="42" y1="694" x2="1158" y2="694"/><line x1="350" y1="42" x2="350" y2="694"/><line x1="770" y1="42" x2="770" y2="694"/></g>
  <g fill="#eef2f7"><rect x="42" y="112" width="1116" height="97"/><rect x="42" y="306" width="1116" height="97"/><rect x="42" y="500" width="1116" height="97"/></g>
  <text x="195" y="169" text-anchor="middle" class="r">消息 / 往返</text><text x="560" y="155" text-anchor="middle" class="c">3 条消息，1.5 RTT</text><text x="560" y="184" text-anchor="middle" class="c">首次多半圈</text><text x="955" y="155" text-anchor="middle" class="c">2 条消息，1 RTT</text><text x="955" y="184" text-anchor="middle" class="c">快半圈，可 0-RTT</text>
  <text x="195" y="266" text-anchor="middle" class="r">开场前提</text><text x="560" y="252" text-anchor="middle" class="c">无需预先知道对端静态公钥</text><text x="560" y="281" text-anchor="middle" class="c">适合首次扫码配对</text><text x="955" y="252" text-anchor="middle" class="c">发起方必须可靠持有对端静态公钥</text><text x="955" y="281" text-anchor="middle" class="c">绑定链路必须先解决</text>
  <text x="195" y="363" text-anchor="middle" class="r">身份隐藏</text><text x="560" y="349" text-anchor="middle" class="c">发起方 8 级，响应方 1 级</text><text x="560" y="378" text-anchor="middle" class="c">发起方身份更晚出现</text><text x="955" y="349" text-anchor="middle" class="c">发起方 4 级，响应方 3 级</text><text x="955" y="378" text-anchor="middle" class="c">首条就暴露发起方静态公钥</text>
  <text x="195" y="460" text-anchor="middle" class="r">配对语义</text><text x="560" y="446" text-anchor="middle" class="c">token 授权 → 握手交换 → 指纹确认</text><text x="560" y="475" text-anchor="middle" class="c">流程自然</text><text x="955" y="446" text-anchor="middle" class="c">token 仍可用，但要先分发/绑定静态公钥</text><text x="955" y="475" text-anchor="middle" class="c">Relay 不能被隐式当成信任根</text>
  <text x="195" y="557" text-anchor="middle" class="r">实现 / 回退</text><text x="560" y="543" text-anchor="middle" class="c">单一脚本，跨语言向量清晰</text><text x="560" y="572" text-anchor="middle" class="c">少一层 Pipes/fallback 复杂度</text><text x="955" y="543" text-anchor="middle" class="c">若加 Noise Pipes，需 IK + XXfallback + 协商</text><text x="955" y="572" text-anchor="middle" class="c">库支持与失败分支更多</text>
  <text x="195" y="654" text-anchor="middle" class="r">首发结论</text><text x="560" y="640" text-anchor="middle" class="c" fill="#047857">推荐：首发冻结 XX</text><text x="560" y="669" text-anchor="middle" class="c">先把正确性与配对做稳</text><text x="955" y="640" text-anchor="middle" class="c" fill="#1d4ed8">暂不作为首发默认</text><text x="955" y="669" text-anchor="middle" class="c">可作为未来重连优化</text>
  <text x="600" y="750" text-anchor="middle" font-size="20" fill="#7b341e">注意：官方规范定义的是安全属性；性能数字与 iOS/Connector 互操作仍必须由 Spike 实测。</text>
</svg>
